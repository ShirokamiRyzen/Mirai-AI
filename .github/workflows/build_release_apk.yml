name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g., v1.0.0, leave empty to auto-detect from build.gradle.kts)'
        required: false
        default: ''
      draft:
        description: 'Save as Draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch complete commit history for accurate changelogs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Determine Version, Tag & Changelog
        id: vars
        run: |
          # 1. Resolve Version and Tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            RELEASE_TAG="${{ inputs.tag_name }}"
            VERSION="${RELEASE_TAG#v}"
          else
            # Extract versionName from app/build.gradle.kts
            VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VERSION_NAME" ]; then
              VERSION_NAME="1.0.0"
            fi
            VERSION="$VERSION_NAME"
            RELEASE_TAG="v$VERSION"
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          # 2. Generate Changelog from Git Log
          PREV_TAG=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          echo "### 📝 What's Changed in ${RELEASE_TAG}" > changelog.md
          echo "" >> changelog.md
          
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$RELEASE_TAG" ]; then
            echo "Changes since **$PREV_TAG**:" >> changelog.md
            git log "${PREV_TAG}..HEAD" --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> changelog.md
          else
            echo "Recent changes:" >> changelog.md
            git log -n 15 --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H))" --no-merges >> changelog.md
          fi
          echo "" >> changelog.md

      - name: Sign & Prepare APK
        id: sign_apk
        run: |
          # Locate built release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          APK_NAME="MiraiAI-${RELEASE_TAG}.apk"

          # Prepare Android build-tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          # Check if repository signing secrets are configured
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ]; then
            echo "Signing with Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
            KEYSTORE_FILE="release.keystore"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          else
            echo "No keystore secret detected. Creating a temporary release signing key..."
            keytool -genkey -v -keystore release.keystore -alias mirai -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=MiraiAI, OU=Mobile, O=Mirai, L=Jakarta, ST=Jakarta, C=ID"
            KEYSTORE_FILE="release.keystore"
            KEY_ALIAS="mirai"
            STORE_PASS="android"
            KEY_PASS="android"
          fi

          # Zipalign and Sign APK
          $ZIPALIGN -v -p 4 "$UNSIGNED_APK" aligned.apk || cp "$UNSIGNED_APK" aligned.apk
          $APKSIGNER sign --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$APK_NAME" aligned.apk

          # Verify signature
          $APKSIGNER verify "$APK_NAME"

          # Compute SHA-256 Checksum
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          SHA256_VAL=$(awk '{print $1}' "${APK_NAME}.sha256")
          FILE_SIZE=$(ls -lh "$APK_NAME" | awk '{print $5}')

          echo "APK_FILE=$APK_NAME" >> $GITHUB_ENV
          echo "SHA_FILE=${APK_NAME}.sha256" >> $GITHUB_ENV

          # Append package information to release notes
          echo "" >> changelog.md
          echo "### 📦 Package Information" >> changelog.md
          echo "| File | Size | SHA-256 Checksum |" >> changelog.md
          echo "| :--- | :--- | :--- |" >> changelog.md
          echo "| \`$APK_NAME\` | $FILE_SIZE | \`$SHA256_VAL\` |" >> changelog.md
          echo "" >> changelog.md
          echo "> 💡 **Installation:** Download \`$APK_NAME\` and install on your Android device (allow *Install Unknown Apps* if prompted)." >> changelog.md

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiraiAI-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Mirai AI ${{ env.RELEASE_TAG }}
          body_path: changelog.md
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
